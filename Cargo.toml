[package]
name = "compositor"
version = "1.0.0"
edition = "2024"

[workspace]
members = ["."]

[dependencies.smithay]
# Spike: local smithay checkout on branch etna-spike (60aafc2b tree + etna renderer).
path = "../smithay"
default-features = false
features = [
  "backend_winit",
  "backend_drm",
  "backend_gbm",
  "backend_egl",
  "backend_udev",
  "backend_session_libseat",
  "backend_libinput",
  "renderer_gl",
  "desktop",
  "wayland_frontend",
]

[dependencies.smithay-drm-extras]
path = "../smithay/smithay-drm-extras"
default-features = false

[features]
# Spike: composite on the etnaviv 2D core instead of GLES (udev only).
etna = ["smithay/renderer_etna"]

[dependencies]
mxconfig = { git = "https://github.com/mecha-org/mxconfig", rev = "510a018ef9e0a174fecac7cedb5369231a494e30" }
sd-notify = "0.5.0"
thiserror = "2.0.20"
tracing = { version = "0.1", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3.11"
